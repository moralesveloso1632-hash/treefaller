[package]
name = "horizon-mod-api-macros"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
